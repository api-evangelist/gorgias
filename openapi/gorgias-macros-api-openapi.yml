openapi: 3.1.0
info:
  title: Gorgias REST Account Macros API
  description: Best-effort OpenAPI 3.1 for the Gorgias REST API, covering tickets, messages, customers, integrations, macros, rules, tags, teams, users, views, surveys, and widgets. Gorgias uses per-account subdomains ({account}.gorgias.com) and supports HTTP Basic authentication with an API key or OAuth2 for public apps.
  version: '2024-01-01'
servers:
- url: https://{account}.gorgias.com
  variables:
    account:
      default: example
      description: Account subdomain
security:
- basicAuth: []
- oauth2:
  - openid
  - accounts.read
  - tickets.read
  - tickets.write
  - customers.read
  - customers.write
tags:
- name: Macros
paths:
  /api/macros:
    get:
      tags:
      - Macros
      summary: List macros
      operationId: listMacros
      responses:
        '200':
          description: Macros
    post:
      tags:
      - Macros
      summary: Create macro
      operationId: createMacro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Macro'
      responses:
        '201':
          description: Macro
  /api/macros/{id}:
    get:
      tags:
      - Macros
      summary: Get macro
      operationId: getMacro
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Macro
    put:
      tags:
      - Macros
      summary: Update macro
      operationId: updateMacro
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Macro'
      responses:
        '200':
          description: Macro
    delete:
      tags:
      - Macros
      summary: Delete macro
      operationId: deleteMacro
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
components:
  schemas:
    Macro:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        actions:
          type: array
          items:
            type: object
        created_datetime:
          type: string
          format: date-time
        updated_datetime:
          type: string
          format: date-time
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use account email as username and API key as password
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{account}.gorgias.com/oauth/authorize
          tokenUrl: https://{account}.gorgias.com/oauth/token
          scopes:
            openid: OpenID
            accounts.read: Read account
            tickets.read: Read tickets
            tickets.write: Write tickets
            customers.read: Read customers
            customers.write: Write customers
