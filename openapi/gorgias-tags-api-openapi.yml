openapi: 3.1.0
info:
  title: Gorgias REST Account Tags API
  description: Best-effort OpenAPI 3.1 for the Gorgias REST API, covering tickets, messages, customers, integrations, macros, rules, tags, teams, users, views, surveys, and widgets. Gorgias uses per-account subdomains ({account}.gorgias.com) and supports HTTP Basic authentication with an API key or OAuth2 for public apps.
  version: '2024-01-01'
servers:
- url: https://{account}.gorgias.com
  variables:
    account:
      default: example
      description: Account subdomain
security:
- basicAuth: []
- oauth2:
  - openid
  - accounts.read
  - tickets.read
  - tickets.write
  - customers.read
  - customers.write
tags:
- name: Tags
paths:
  /api/tickets/{id}/tags:
    post:
      tags:
      - Tags
      summary: Add tags to a ticket
      operationId: addTicketTags
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Tags
  /api/tags:
    get:
      tags:
      - Tags
      summary: List tags
      operationId: listTags
      responses:
        '200':
          description: Tags
    post:
      tags:
      - Tags
      summary: Create tag
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tag'
      responses:
        '201':
          description: Tag
  /api/tags/{id}:
    get:
      tags:
      - Tags
      summary: Get tag
      operationId: getTag
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Tag
    put:
      tags:
      - Tags
      summary: Update tag
      operationId: updateTag
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tag'
      responses:
        '200':
          description: Tag
    delete:
      tags:
      - Tags
      summary: Delete tag
      operationId: deleteTag
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        decoration:
          type: object
          properties:
            color:
              type: string
        created_datetime:
          type: string
          format: date-time
        updated_datetime:
          type: string
          format: date-time
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use account email as username and API key as password
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{account}.gorgias.com/oauth/authorize
          tokenUrl: https://{account}.gorgias.com/oauth/token
          scopes:
            openid: OpenID
            accounts.read: Read account
            tickets.read: Read tickets
            tickets.write: Write tickets
            customers.read: Read customers
            customers.write: Write customers
