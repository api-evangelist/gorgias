openapi: 3.1.0
info:
  title: Gorgias REST Account Users API
  description: Best-effort OpenAPI 3.1 for the Gorgias REST API, covering tickets, messages, customers, integrations, macros, rules, tags, teams, users, views, surveys, and widgets. Gorgias uses per-account subdomains ({account}.gorgias.com) and supports HTTP Basic authentication with an API key or OAuth2 for public apps.
  version: '2024-01-01'
servers:
- url: https://{account}.gorgias.com
  variables:
    account:
      default: example
      description: Account subdomain
security:
- basicAuth: []
- oauth2:
  - openid
  - accounts.read
  - tickets.read
  - tickets.write
  - customers.read
  - customers.write
tags:
- name: Users
paths:
  /api/users:
    get:
      tags:
      - Users
      summary: List users
      operationId: listUsers
      responses:
        '200':
          description: Users
    post:
      tags:
      - Users
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: User
  /api/users/{id}:
    get:
      tags:
      - Users
      summary: Get user
      operationId: getUser
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: User
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use account email as username and API key as password
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{account}.gorgias.com/oauth/authorize
          tokenUrl: https://{account}.gorgias.com/oauth/token
          scopes:
            openid: OpenID
            accounts.read: Read account
            tickets.read: Read tickets
            tickets.write: Write tickets
            customers.read: Read customers
            customers.write: Write customers
