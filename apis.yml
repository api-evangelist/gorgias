apis:
- aid: gorgias:webhooks
  name: Gorgias Webhooks
  description: >-
    Outbound webhook surface delivered through Gorgias HTTP Integrations. When configured triggers fire
    on a Gorgias account, Gorgias sends an HTTP request to the URL set on the TicketHttpIntegration, with
    the request URL, headers, and body rendered from a Jinja-style template that exposes the related ticket,
    message, and customer context. Supported triggers include ticket-created, ticket-updated, ticket-status-updated,
    ticket-assignment-updated, ticket-handed-over, ticket-self-unsnoozed, ticket-message-created, and
    ticket-message-failed.
  humanURL: https://developers.gorgias.com/reference/the-tickethttpintegration-object
  tags:
  - Webhook
  - Event
  - HTTP Integration
  - Tickets
  - Message
  tags_raw:
  - Webhooks
  - Events
  - HTTP Integration
  - Tickets
  - Messages
